<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">HELLO WORLD // PROFILE — HI, I'M XTRAMO</title>
  <desc id="desc">Dark navy and neon blue developer profile banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#101B35"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E3A5F" stroke-width="1" opacity=".4"/>
    </pattern>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="20" fill="url(#grid)"/>
  <g fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)">
    <path d="M-20 245H180L220 205H355" opacity=".8" stroke-dasharray="180 600">
      <animate attributeName="stroke-dashoffset" values="800;0;-800" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M850 68H990L1030 108H1220" opacity=".7" stroke-dasharray="170 600">
      <animate attributeName="stroke-dashoffset" values="600;0;-600" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M900 270H1030L1070 230H1220" opacity=".55" stroke-dasharray="150 600">
      <animate attributeName="stroke-dashoffset" values="500;0;-500" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#38BDF8">
    <circle cx="105" cy="100" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="165" r="2"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="275" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="78" y="76" fill="#7DD3FC" font-size="17" letter-spacing="3">HELLO WORLD // PROFILE</text>
    <text x="74" y="165" fill="#E0F2FE" font-size="65" font-weight="700">HI, I'M XTRAMO<tspan fill="#38BDF8">.</tspan></text>
    <text x="80" y="211" fill="url(#neon)" font-size="25">I want to be a Developer</text>
    <text x="81" y="260" fill="#94A3B8" font-size="16">DESIGN  /  FULL-STACK  /  AI</text>
    <rect x="81" y="278" width="10" height="18" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="1198" height="328" rx="19" fill="none" stroke="#164E75" stroke-width="2"/>
</svg>
